<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="title">Agape</h1>
  </header>

  <main class="main">
    <div class="controls">
      <label class="control">
        <span class="control-label">Formato</span>
        <select id="format" class="select">
          <option value="square">Quadrato</option>
          <option value="portrait">Verticale</option>
          <option value="landscape">Orizzontale</option>
          <option value="stories">Stories</option>
        </select>
      </label>

      <button type="button" id="generate" class="btn btn-primary">Nuovo collage</button>
      <button type="button" id="export" class="btn" disabled>Scarica</button>
    </div>

    <div class="stage-wrap">
      <canvas id="stage" class="stage" aria-label="Collage generato"></canvas>
      <p id="loading" class="loading">Caricamento immagini…</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
